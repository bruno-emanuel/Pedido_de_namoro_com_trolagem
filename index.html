<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido de Namoro - Trolagem</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>💘</span><span>😂</span><span>💖</span><span>🤣</span><span>💕</span>
  </div>

  <main class="card">
    <div class="emoji">😏💍</div>
    <h1>Quer namorar comigo?</h1>
    <p class="subtitle">Escolha com sabedoria... ou tente, né kkkkk</p>

    <div class="buttons">
      <button id="sim" class="btn yes">Sim 😍</button>
      <button id="nao" class="btn no">Não 😂</button>
    </div>

    <p id="contador" class="counter">Tentativas no Sim: 0</p>
    <section id="mensagem" class="message hidden">
      <h2>KKKKKK era trolagem!</h2>
      <p>O “Sim” fugiu porque até ele sabe que você merece coisa melhor 😭😂</p>
      <p class="small">Brincadeira, viu? Agora manda esse site pra pessoa e observa o caos.</p>
      <button id="reiniciar" class="btn reset">Tentar de novo</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
